/* =========================== EKİP & GELİŞİM KONTROL PANELLERİ =========================== */
UI.teamSub=UI.teamSub||'roster'; UI.growSub=UI.growSub||'office'; UI.rf=UI.rf||'all'; UI.rs=UI.rs||'lvl';
function subSeg(key,items){
  return `<div class="subseg" role="tablist">${items.map(([id,n,b])=>`<button role="tab" class="${UI[key]===id?'on':''}" data-act="sub" data-k="${key}" data-v="${id}">${n}${b?`<span class="pill ${b.c||''}">${b.t}</span>`:''}</button>`).join('')}</div>`;
}
function agentStatus(a){
  if(a.training) return a.training.stat==='rest'?['Molada','gold']:a.training.stat==='spec'?['Uzmanlık eğitimi','gold']:['Eğitimde','gold'];
  if(a.fat>70) return ['Çok yorgun','red']; if(a.morale<35) return ['Moral düşük','red'];
  if(S.eom&&S.eom.id===a.id) return ['Ayın çalışanı','gold'];
  return null;
}
const RF=[['all','Tümü',a=>true],['tired','Yorgun',a=>a.fat>50],['low','Düşük moral',a=>a.morale<45],['train','Eğitimde',a=>!!a.training],['idle','Hazır',a=>!a.training&&a.fat<=50]];
const RS=[['lvl','Seviye'],['eff','Verim'],['mor','Moral'],['fat','Yorgunluk'],['sal','Maaş']];
function rosterList(){
  const E=eff(); const f=(RF.find(x=>x[0]===UI.rf)||RF[0])[2];
  const k=UI.rs, key={lvl:a=>a.lvl*1000+a.xp/100,eff:a=>agentCap(a,E),mor:a=>a.morale,fat:a=>a.fat,sal:a=>a.sal}[k];
  return S.agents.filter(f).sort((a,b)=>key(b)-key(a));
}
function teamSummary(){
  let sal=0,mor=0,fat=0; S.agents.forEach(a=>{sal+=a.sal;mor+=a.morale;fat+=a.fat;}); const n=Math.max(1,S.agents.length), L=UI.live||{};
  const occ=L.cap?L.dem/L.cap:0;
  const t=(l,v,s,c)=>`<div class="tsum"><small>${l}</small><b class="${c||''}">${v}</b><span>${s}</span></div>`;
  return `<div class="tsums">${t('Temsilci',`${S.agents.length}<i>/${office().seats}</i>`,'masa dolu')}${t('Kapasite',fn(L.cap||0),`talep ${fn(L.dem||0)} · %${Math.round(occ*100)} dolu`,occ>1?'bad':occ>.85?'warn':'')}${t('Ort. moral',Math.round(mor/n),'25 altı istifa riski',mor/n<40?'bad':'')}${t('Ort. yorgunluk',Math.round(fat/n),'yüksekse verim düşer',fat/n>60?'bad':'')}${t('Aylık maaş',fm(sal),'temsilciler')}</div>`;
}
function agentRow(a,E){
  const st=agentStatus(a), sel=UI.asel===a.id;
  const bar=(v,c)=>`<span class="mb"><i style="width:${clamp(v,0,100)}%;${c?'background:'+c:''}"></i></span>`;
  return `<button class="arow ${sel?'sel':''}" data-act="asel" data-id="${a.id}">
    <span class="av-lg" style="${avStyle(a)}">${esc(initials(a.name))}<span class="lv">${a.lvl}</span></span>
    <span class="an"><b>${esc(a.name)}</b><span class="mini">${a.spec?secName(a.spec)+' uzmanı':'Genel temsilci'}${st?` · <span class="${st[1]==='red'?'bad':'gold'}">${st[0]}</span>`:''}</span></span>
    <span class="ast"><span>H</span>${bar(a.spd)}<span>E</span>${bar(a.emp)}<span>B</span>${bar(a.kno)}</span>
    <span class="amf"><span title="Moral">${bar(a.morale,'linear-gradient(90deg,#2fa57c,var(--good))')}</span><span title="Yorgunluk">${bar(a.fat,'linear-gradient(90deg,#c27a2a,var(--warn))')}</span></span>
    <span class="acap mono">${Math.round(agentCap(a,E))}<small>/gün</small></span></button>`;
}
function agentDetail(a){
  if(!a) return `<aside class="adetail"><div class="empty">Kadroda kimse yok. İşe alım sekmesinden temsilci al.</div></aside>`;
  const E=eff(), need=300*Math.pow(a.lvl,1.4), tc=trainCost(a), st=agentStatus(a), busy=!!a.training;
  const big=(l,v,h)=>`<div class="bstat"><div class="row sp"><span>${l}</span><b class="mono">${v}</b></div><div class="sbar"><i style="width:${v}%"></i></div><span class="mini">${h}</span></div>`;
  const secs=SECTORS.filter(s=>s.t<=tierIdx());
  const specCost=niceRound(tc*2.5);
  return `<aside class="adetail" id="adetail">
    <div class="row" style="gap:14px"><span class="av-xl" style="${avStyle(a)}">${esc(initials(a.name))}</span><div style="min-width:0"><h3 style="font-size:18px">${esc(a.name)}</h3><span class="mini">Seviye ${a.lvl} · ${a.spec?secName(a.spec)+' uzmanı':'Genel temsilci'}</span>${st?`<div style="margin-top:6px"><span class="tag ${st[1]}">${st[0]}${busy?` · ${Math.max(0,Math.ceil(a.training.until-S.day))} gün`:''}</span></div>`:''}</div></div>
    <div><div class="row sp mini" style="margin-bottom:5px"><span>Deneyim</span><span class="mono">${fn(a.xp)} / ${fn(need)}</span></div><div class="prog"><i style="width:${Math.min(100,a.xp/need*100)}%"></i></div></div>
    <div class="bstats">${big('Hız',a.spd,'Günde kaç çağrı alır')}${big('Empati',a.emp,'Müşteri memnuniyeti')}${big('Bilgi',a.kno,'İlk temasta çözüm')}</div>
    <div class="spec"><div><span>Kapasite</span><b>${Math.round(agentCap(a,E))} çağrı/gün</b></div><div><span>Maaş</span><b>${fm(a.sal)}/ay</b></div><div><span>Moral</span><b class="${a.morale<40?'bad':'good'}">${Math.round(a.morale)}</b></div><div><span>Yorgunluk</span><b class="${a.fat>60?'bad':''}">${Math.round(a.fat)}</b></div><div><span>Bu ay çağrı</span><b>${fn(a.mx||0)}</b></div><div><span>Çalıştığı gün</span><b>${a.hired!=null?Math.floor(S.day-a.hired):'—'}</b></div></div>
    <div class="actgroup"><span class="eyebrow">Eğitim · 3 gün · ${fm(tc)}</span><div class="seg wide">${[['spd','Hız'],['emp','Empati'],['kno','Ürün bilgisi']].map(([k,n])=>`<button data-act="train" data-id="${a.id}" data-s="${k}" ${busy||S.money<tc?'disabled':''}>${n} +6–10</button>`).join('')}</div></div>
    <div class="actgroup"><span class="eyebrow">Uzmanlık eğitimi · 5 gün · ${fm(specCost)}</span><div class="row" style="gap:6px;flex-wrap:nowrap"><select id="specSel" aria-label="Uzmanlık sektörü" ${busy?'disabled':''}>${secs.map(s=>`<option value="${s.id}" ${a.spec===s.id?'selected':''}>${s.n}</option>`).join('')}</select><button class="btn sm" data-act="specTrain" data-id="${a.id}" ${busy||S.money<specCost?'disabled':''}>Başlat</button></div><span class="mini">Aynı sektördeki sözleşmelerde ilk temasta çözüm artar.</span></div>
    <div class="row" style="gap:6px"><button class="btn sm" data-act="arest" data-id="${a.id}" ${busy||a.fat<10?'disabled':''} title="1 gün dinlenir, yorgunluk sıfırlanır">Mola ver</button><button class="btn sm" data-act="raise" data-id="${a.id}" title="Maaş +%10, moral artar">Zam yap (+%10)</button>${cbtn('fire:'+a.id,'İşten çıkar','danger')}</div>
  </aside>`;
}
function rosterSub(){
  const E=eff(), list=rosterList();
  if(!list.find(a=>a.id===UI.asel)) UI.asel=(list[0]||S.agents[0]||{}).id;
  const per=10, pages=Math.max(1,Math.ceil(list.length/per)); UI.pg=clamp(UI.pg,0,pages-1);
  const shown=list.slice(UI.pg*per,UI.pg*per+per);
  const idle=list.filter(a=>!a.training), costAll=idle.filter(a=>a.fat<=60).reduce((s,a)=>s+trainCost(a),0);
  const raiseAll=Math.round(idle.reduce((s,a)=>s+a.sal*.1,0));
  const sel=S.agents.find(a=>a.id===UI.asel);
  return `<div class="tw">
    <section class="panel"><div class="tbar"><div class="chips">${RF.map(([k,n,f])=>`<button class="${UI.rf===k?'on':''}" data-act="rf" data-v="${k}">${n} <span>${S.agents.filter(f).length}</span></button>`).join('')}</div>
      <label class="sortsel"><span class="mini">Sırala</span><select id="rsort" aria-label="Sıralama">${RS.map(([k,n])=>`<option value="${k}" ${UI.rs===k?'selected':''}>${n}</option>`).join('')}</select></label></div>
      ${list.length?`<div class="bulk"><span class="mini">Listedeki ${list.length} kişi için:</span><button class="btn sm" data-act="bulk" data-k="train" ${idle.length&&S.money>=costAll&&costAll?'':'disabled'}>En zayıf yönünde eğit · ${fm(costAll)}</button><button class="btn sm" data-act="bulk" data-k="rest" ${idle.some(a=>a.fat>=10)?'':'disabled'}>Mola ver</button><button class="btn sm" data-act="bulk" data-k="raise" ${idle.length?'':'disabled'}>%10 zam · +${fm(raiseAll)}/ay</button></div>`:''}
      <div class="alist">${shown.map(a=>agentRow(a,E)).join('')||'<div class="empty">Bu filtrede kimse yok.</div>'}</div>
      ${pages>1?`<div class="pager" style="justify-content:center;margin-top:10px"><button class="btn sm" data-act="pg" data-v="-1" ${UI.pg?'':'disabled'} aria-label="Önceki">‹</button><span class="mono sub">${UI.pg+1}/${pages}</span><button class="btn sm" data-act="pg" data-v="1" ${UI.pg<pages-1?'':'disabled'} aria-label="Sonraki">›</button></div>`:''}
    </section>${agentDetail(sel)}</div>`;
}
function hireSub(){
  const ti=tierIdx(), seats=office().seats, full=S.agents.length>=seats;
  const val=c=>(c.spd+c.emp+c.kno)/c.sal*1000; const best=[...S.candidates].sort((a,b)=>val(b)-val(a))[0];
  const cands=[...S.candidates].sort((a,b)=>val(b)-val(a));

      <div class="row"><button class="btn sm" data-act="recruit">Standart ilan · ${fm(1500*(ti+1))}</button><button class="btn sm" data-act="recruitP" title="Daha yetenekli adaylar">Premium ilan · ${fm(6000*(ti+1))}</button><button class="btn pri sm" data-act="qa" data-k="fill" ${full?'disabled':''}>Boş masaları doldur</button></div></div>
    <div class="grid g3">${cands.map(c=>`<div class="card ${c===best?'bestc':''}"><div class="row sp"><div class="co"><span class="av-lg" style="${avStyle(c)}">${esc(initials(c.name))}</span><div style="min-width:0"><b>${esc(c.name)}</b><span class="mini">${c.spec?secName(c.spec)+' uzmanı':'Genel temsilci'}</span></div></div>${c===best?'<span class="tag gold">En verimli</span>':''}</div>
      ${statBlock(c)}<div class="row sp"><div><span class="eyebrow">Maaş</span><div class="mono" style="font-weight:600">${fm(c.sal)}/ay</div></div><div style="text-align:right"><span class="eyebrow">Toplam</span><div class="mono gold" style="font-weight:600">${c.spd+c.emp+c.kno}</div></div></div>
      <button class="btn pri" data-act="hire" data-id="${c.id}" ${full?'disabled':''}>İşe al</button></div>`).join('')||'<div class="empty">Aday kalmadı. İlan vererek yeni adaylar çekebilirsin.</div>'}</div></section>`;
}
function teamView(){
  const sub=UI.teamSub;
  const freeSeats=office().seats-S.agents.length;
  return `${teamSummary()}${subSeg('teamSub',[['roster','Kadro',{t:S.agents.length}],['hire','İşe alım',freeSeats&&S.candidates.length?{t:freeSeats+' boş',c:'green'}:null],['support','Destek kadrosu',{t:S.support.lead+S.support.qa+S.support.wfm}]])}
    <section class="panel tempo-bar">${tempoHTML()}</section>
    <div id="sec-roster" ${sub==='roster'?'':'hidden'}>${sub==='roster'?rosterSub():''}</div>
    <div id="sec-hire" ${sub==='hire'?'':'hidden'}>${sub==='hire'?hireSub():''}</div>
    <div id="sec-support" ${sub==='support'?'':'hidden'}>${sub==='support'?supportPage():''}</div>`;
}

/* --- Gelişim --- */
function branchesHTML2(){
  const ti=tierIdx(), rv=eff().rev, tot=branchIncome()*rv;
  const afford=BRANCHES.filter(b=>ti>=b.t&&(S.branches[b.id]||0)<BR_MAX&&S.money>=branchCost(b));
  return `<section class="panel"><div class="ph"><div><span class="eyebrow">Pasif gelir · sen yokken de çalışır</span><h2>Şubeler <span class="gold mono" style="font-size:15px">+${fm(tot)}/gün</span></h2></div><button class="btn pri sm" data-act="branchAll" ${afford.length?'':'disabled'}>Uygun olanları geliştir${afford.length?` (${afford.length})`:''}</button></div>
    <div class="brs">${BRANCHES.map(b=>{ const l=S.branches[b.id]||0, lock=ti<b.t, c=branchCost(b), can=!lock&&l<BR_MAX&&S.money>=c;
      const gain=(branchInc(b,l+1)-branchInc(b,l))*rv, pay=gain>0?Math.ceil(c/gain):0;
      return `<div class="br ${l?'own':''} ${lock?'locked':''}"><div class="row sp"><div style="min-width:0"><b>${b.n}</b><span class="mini">${b.r}</span></div>${l?`<span class="pill gold">Sv ${l}</span>`:lock?`<span class="pill">${ic('lock',2)}</span>`:''}</div>
        <div class="lvd">${Array.from({length:BR_MAX},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>
        <div class="spec" style="grid-template-columns:1fr"><div><span>Şu an</span><b class="${l?'gold':''}">${l?'+'+fm(branchInc(b,l)*rv):'—'}/gün</b></div>${l<BR_MAX?`<div><span>${l?'Geliştirince':'Açınca'}</span><b class="good">+${fm(gain)}/gün</b></div><div><span>Kendini öder</span><b>${pay} gün</b></div>`:''}</div>
        ${lock?`<button class="btn sm" disabled>${TIERS[b.t].title} gerekir</button>`:l>=BR_MAX?'<button class="btn sm" disabled>En üst seviye</button>':`<button class="btn sm ${can?'pri':''}" data-act="branch" data-id="${b.id}" ${can?'':'disabled'}>${l?'Geliştir':'Şube aç'} · ${fm(c)}</button>`}</div>`; }).join('')}</div></section>`;
}
function growView(){
  const sub=UI.growSub, ti=tierIdx();
  const techReady=TECHS.filter(t=>techState(t)==='ready').length;
  const brReady=BRANCHES.filter(b=>ti>=b.t&&(S.branches[b.id]||0)<BR_MAX&&S.money>=branchCost(b)).length;
  const nx=OFFICES[S.office+1], offReady=nx&&S.money>=nx.cost;
  return `${subSeg('growSub',[['office','Tesis',offReady?{t:'Taşınabilir',c:'gold'}:null],['branch','Şubeler',brReady?{t:brReady,c:'gold'}:{t:Object.values(S.branches).filter(Boolean).length+'/'+BRANCHES.length}],['tech','AR-GE',techReady?{t:techReady,c:'gold'}:{t:Object.keys(S.techs).length+'/'+TECHS.length}]])}
    <div id="sec-office" ${sub==='office'?'':'hidden'}>${sub==='office'?officePage():''}</div>
    <div id="sec-branch" ${sub==='branch'?'':'hidden'}>${sub==='branch'?branchesHTML2():''}</div>
    <div id="sec-tech" ${sub==='tech'?'':'hidden'}>${sub==='tech'?techPage():''}</div>`;
}

/* --- Eylemler --- */
function bulkAction(k){
  const list=rosterList().filter(a=>!a.training); let n=0, cost=0;
  if(k==='train'){ for(const a of list){ if(a.fat>60) continue; const c=trainCost(a); if(S.money<c) break; const st=['spd','emp','kno'].sort((x,y)=>a[x]-a[y])[0]; S.money-=c; cost+=c; a.training={stat:st,until:S.day+3}; S.stats.trained=(S.stats.trained||0)+1; n++; } toast(n?`${n} kişi eğitime başladı (${fm(cost)})`:'Uygun kimse yok'); }
  else if(k==='rest'){ for(const a of list) if(a.fat>=10){ a.training={stat:'rest',until:S.day+1}; n++; } toast(n?`${n} kişi 1 günlük molaya çıktı`:'Molaya ihtiyacı olan yok'); }
  else if(k==='raise'){ for(const a of list){ a.sal=Math.round(a.sal*1.1/50)*50; a.bonus+=18; n++; } toast(`${n} kişiye %10 zam yapıldı`); }
  if(n) addLog(k==='train'?`${n} temsilci toplu eğitime gönderildi.`:k==='rest'?`${n} temsilci molaya çıktı.`:`${n} temsilciye zam yapıldı.`);
  UI.deskKey=''; UI.dirty=true;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||!S) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='sub'){ UI[b.dataset.k]=b.dataset.v; UI.pg=0; UI.rendered=null; }
  else if(a==='asel'){ UI.asel=+id; UI.dirty=true; if(innerWidth<1000) requestAnimationFrame(()=>{ const d=$('#adetail'); if(d) d.scrollIntoView({block:'start'}); }); }
  else if(a==='rf'){ UI.rf=b.dataset.v; UI.pg=0; }
  else if(a==='bulk') bulkAction(b.dataset.k);
  else if(a==='arest'){ const x=S.agents.find(q=>q.id==id); if(x&&!x.training){ x.training={stat:'rest',until:S.day+1}; UI.deskKey=''; toast(`${x.name} 1 günlük molaya çıktı`); } }
  else if(a==='specTrain'){ const x=S.agents.find(q=>q.id==id), sec=$('#specSel')&&$('#specSel').value, c=niceRound(trainCost(x)*2.5);
    if(x&&!x.training&&sec&&S.money>=c){ S.money-=c; x.training={stat:'spec',spec:sec,until:S.day+5}; S.stats.trained=(S.stats.trained||0)+1; UI.deskKey=''; addLog(`${x.name} ${secName(sec)} uzmanlık eğitimine başladı (${fm(c)}).`); toast('Uzmanlık eğitimi başladı'); } }
  else if(a==='recruitP'){ const ti=tierIdx(), c=6000*(ti+1); if(S.money>=c){ S.money-=c; S.candidates=[]; for(let i=0;i<4+Math.min(4,S.office);i++){ const g=genAgent(ti); for(const k of ['spd','emp','kno']) g[k]=Math.min(95,g[k]+RI(6,12)); g.sal=Math.round((3000+(g.spd+g.emp+g.kno)*22)/100)*100; S.candidates.push(g); } S.candDay=S.day+7; addLog('Premium ilan yayınlandı, yetenekli adaylar geldi.','good'); toast('Premium adaylar geldi'); } }
  else if(a==='branchAll'){ let n=0; for(let i=0;i<20;i++){ const ti=tierIdx(); const c=BRANCHES.filter(x=>ti>=x.t&&(S.branches[x.id]||0)<BR_MAX&&S.money>=branchCost(x)).sort((x,y)=>branchCost(x)-branchCost(y))[0]; if(!c) break; S.money-=branchCost(c); S.branches[c.id]=(S.branches[c.id]||0)+1; n++; } if(n){ addLog(`${n} şube geliştirmesi yapıldı.`,'good'); toast(`${n} şube geliştirildi`); checkAch(); } }
  else if(a==='prio'){ const c=S.contracts.find(q=>q.id==id); if(c){ c.prio=!c.prio; toast(c.prio?`${c.co} öncelikli hat oldu`:`${c.co} normal önceliğe döndü`); } }
  else return;
  UI.dirty=true;
});
document.addEventListener('change',e=>{ if(!S) return; if(e.target.id==='rsort'){ UI.rs=e.target.value; UI.pg=0; UI.dirty=true; } });
