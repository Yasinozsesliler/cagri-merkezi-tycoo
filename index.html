<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çağrı Merkezi Tycoon</title>
<meta name="description" content="Bodrum kattaki iki kişilik hattından kıtalararası bir çağrı devine. Sözleşmeleri kap, ekibini yetiştir, şubeler aç ve şirketini halka arz et.">
<meta name="theme-color" content="#070a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ÇM Tycoon">
<meta property="og:title" content="Çağrı Merkezi Tycoon">
<meta property="og:description" content="Premium idle çağrı merkezi yönetim oyunu.">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
<style>
/* Yerleşim: yüzen kategori menüsü (sol) + cam katmanlı kontrol odası; telefonda alt kategori çubuğu ve alt sekmeler.
   Tek, bilinçli koyu tema: gece vardiyası kontrol odası. Altın = değer/prestij, mavi = canlı hat verisi. */
:root{
  color-scheme:dark;
  --bg:#070a14; --glow-1:rgba(124,98,255,.20); --glow-2:rgba(58,132,255,.15); --glow-3:rgba(230,196,127,.07);
  --panel:#0e1323; --panel-2:#131a2e; --panel-3:#1a223b; --glass:rgba(14,19,35,.72);
  --line:rgba(158,174,222,.10); --line-2:rgba(158,174,222,.20);
  --ink:#eef1fa; --muted:#949db8; --dim:#626b8a;
  --gold:#e8c780; --gold-2:#c9a159; --gold-deep:#8d6a2f; --on-gold:#1b1407;
  --azure:#6ea9ff; --violet:#9a86ff;
  --good:#52d8a6; --warn:#f4b862; --bad:#ff6d82;
  --shadow:0 24px 48px -24px rgba(0,0,0,.75);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:16px 32px;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 620px at 6% -8%,var(--glow-1),transparent 62%),radial-gradient(820px 640px at 104% 108%,var(--glow-2),transparent 60%),radial-gradient(600px 400px at 60% 30%,var(--glow-3),transparent 70%),var(--bg)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)} .muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.01em}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}

/* ===== UYGULAMA İSKELETİ ===== */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);gap:20px;max-width:1520px;margin:0 auto;align-items:start}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px);display:flex;flex-direction:column;gap:18px;padding:18px 14px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:auto;scrollbar-width:none}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#fff3d1 0,var(--gold) 38%,var(--gold-deep) 100%);box-shadow:0 8px 24px -8px rgba(232,199,128,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.logo svg{width:24px;height:24px;stroke:var(--on-gold)}
.brand .nm{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.brand .tl{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.tierbox{padding:12px 12px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.tierbox .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--muted)}
.tierbar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}
.tierbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));box-shadow:0 0 12px rgba(232,199,128,.5)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .eyebrow{padding:0 10px 6px}
.navi{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;border:0;background:none;color:var(--muted);font:600 13.5px var(--f-body);cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s}
.navi svg{width:18px;height:18px;flex:none;stroke:currentColor;opacity:.85}
.navi:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.navi.act{color:var(--ink);background:linear-gradient(90deg,rgba(232,199,128,.16),rgba(232,199,128,.03));box-shadow:inset 0 0 0 1px rgba(232,199,128,.18)}
.navi.act svg{stroke:var(--gold);opacity:1}
.navi .lb{flex:1;min-width:0}
.pill{font:600 10.5px var(--f-mono);padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--muted)}
.pill.gold{background:rgba(232,199,128,.16);color:var(--gold)}
.pill.red{background:var(--bad);color:#24070d}
.pill.green{background:rgba(82,216,166,.14);color:var(--good)}
.side .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 16px;margin-top:-16px;padding-top:16px;
  background:linear-gradient(180deg,var(--bg) 55%,rgba(7,10,20,0));}
.crumbs{min-width:0}
.crumbs .eyebrow{color:var(--gold-2)}
.crumbs h1{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.mbrand{display:none}
.res{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.chip{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);min-width:0}
.chip .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05)}
.chip .ic svg{width:16px;height:16px}
.chip small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.chip b{display:block;font:600 14.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ic.g{background:rgba(232,199,128,.13)} .ic.g svg{stroke:var(--gold)}
.ic.a{background:rgba(110,169,255,.13)} .ic.a svg{stroke:var(--azure)}
.ic.v{background:rgba(154,134,255,.14)} .ic.v svg{stroke:var(--violet)}
.ic.n{background:rgba(82,216,166,.12)} .ic.n svg{stroke:var(--good)}
.speed{display:flex;padding:4px;gap:2px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.speed button{border:0;background:none;color:var(--muted);min-width:40px;height:36px;border-radius:10px;font:600 12.5px var(--f-mono);cursor:pointer}
.speed button:hover{color:var(--ink)}
.speed button.act{background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--on-gold);box-shadow:0 6px 16px -6px rgba(232,199,128,.6)}
.subtabs{display:none}

/* ===== PANEL & KART ===== */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph .eyebrow{display:block;margin-bottom:3px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:11px;min-width:0;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.sub{font-size:12px;color:var(--muted)}
.mini{font-size:11px;color:var(--dim)}
.mono-tag{font:600 11px var(--f-mono);color:var(--muted)}
.tier{font:700 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap;border:1px solid}
.t0{color:#d9a27a;border-color:rgba(217,162,122,.35);background:rgba(217,162,122,.08)}
.t1{color:#c7d0e4;border-color:rgba(199,208,228,.3);background:rgba(199,208,228,.07)}
.t2{color:var(--gold);border-color:rgba(232,199,128,.35);background:rgba(232,199,128,.08)}
.t3{color:var(--azure);border-color:rgba(110,169,255,.35);background:rgba(110,169,255,.08)}
.t4{color:var(--violet);border-color:rgba(154,134,255,.4);background:rgba(154,134,255,.1)}
.tag{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.red{color:var(--bad);background:rgba(255,109,130,.1)}
.tag.gold{color:var(--gold);background:rgba(232,199,128,.1)}
.tag.green{color:var(--good);background:rgba(82,216,166,.1)}
.mono-sq{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font:700 13px var(--f-display);color:#0a0d18}
.co{display:flex;gap:12px;align-items:center;min-width:0}
.co b{display:block;font-weight:700;font-size:14.5px;overflow-wrap:anywhere}

.btn{font:700 13px var(--f-body);padding:9px 15px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:rgba(232,199,128,.35)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#f2d79d,var(--gold) 45%,var(--gold-2));color:var(--on-gold);border-color:transparent;box-shadow:0 8px 20px -10px rgba(232,199,128,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#f2d79d,var(--gold) 45%,var(--gold-2));border-color:transparent;filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.confirm{background:var(--bad);color:#24070d;border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:none;color:var(--muted);font:600 11.5px var(--f-body);padding:5px 9px;border-radius:7px;cursor:pointer}
.seg button:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}

/* ===== KOMUTA MERKEZİ ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:stretch;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(232,199,128,.14),transparent 65%);pointer-events:none}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.03em;line-height:1.05}
.hero .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.fact{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.fact small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.fact b{font:600 17px var(--f-mono)}
.callout{border-radius:14px;padding:14px;background:linear-gradient(135deg,rgba(244,184,98,.14),rgba(244,184,98,.04));border:1px solid rgba(244,184,98,.3);display:flex;flex-direction:column;gap:8px;justify-content:center}
.callout.calm{background:linear-gradient(135deg,rgba(110,169,255,.10),rgba(110,169,255,.02));border-color:rgba(110,169,255,.22)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:14px;border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .top2{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font:600 22px var(--f-display);letter-spacing:-.02em;line-height:1}
.kpi .s{font-size:11px;color:var(--dim)}
.gauge{width:46px;height:46px;flex:none}
.gauge circle{fill:none;stroke-width:5}
.gauge .bg{stroke:rgba(255,255,255,.07)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}

/* Ofis salonu */
.floor{border-radius:14px;padding:16px;background:
  radial-gradient(ellipse at 50% 0%,rgba(110,169,255,.08),transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 28px),#0a0f1d;border:1px solid var(--line)}
.desks{display:grid;grid-template-columns:repeat(auto-fill,var(--ds,52px));gap:10px;justify-content:start}
.desk{width:var(--ds,52px);height:var(--ds,52px);border-radius:14px;position:relative;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);transition:box-shadow .4s,border-color .4s}
.desk .av{width:72%;height:72%;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-body);color:#0a0d18}
.desk::after{content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:10px;height:4px;border-radius:3px;background:var(--dim)}
.desk.on{border-color:rgba(82,216,166,.45);box-shadow:0 0 0 1px rgba(82,216,166,.2),0 0 18px -4px rgba(82,216,166,.55)}
.desk.on::after{background:var(--good)}
.desk.tr{border-color:rgba(232,199,128,.45)} .desk.tr::after{background:var(--gold)}
.desk.tired .av{outline:2px solid var(--bad);outline-offset:1px}
.desk.empty{background:transparent;border:1px dashed rgba(158,174,222,.16)}
.desk.empty::after{display:none}
.desks.tiny{gap:5px}
.desks.tiny .desk{border-radius:5px}
.desks.tiny .desk .av{font-size:0;width:55%;height:55%}
.desks.tiny .desk::after{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
@media (prefers-reduced-motion:no-preference){.desk.on .av{animation:breathe 2.4s ease-in-out infinite}}
@keyframes breathe{50%{transform:scale(.92)}}

/* sözleşme göstergeleri */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meter small{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.meter b{font:600 13px var(--f-mono)}
.mbar{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:5px}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.mbar em{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);opacity:.7;border-radius:1px}
.prog{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),var(--violet))}
.value{font:700 20px var(--f-display);letter-spacing:-.02em}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.spec div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:6px}
.spec span{color:var(--muted)}
.spec b{font:600 12.5px var(--f-mono)}

/* grafik */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.chart svg{width:100%;height:96px;display:block;margin-top:10px}
.chart .v{font:600 22px var(--f-display);letter-spacing:-.02em}

/* akış */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:62px 12px 1fr;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.feed li:last-child{border-bottom:0}
.feed time{font:11px var(--f-mono);color:var(--dim);padding-top:2px}
.feed .dot{margin-top:6px;background:var(--dim)}
.feed .good .dot,.feed li.good .dot{background:var(--good)} .feed li.bad .dot{background:var(--bad)}
.scroll{max-height:340px;overflow:auto;scrollbar-width:thin}

/* kadro */
.av-lg{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-body);color:#0a0d18;flex:none;position:relative}
.av-lg .lv{position:absolute;right:-4px;bottom:-4px;font:700 9.5px var(--f-mono);background:var(--panel-3);color:var(--gold);border:1px solid rgba(232,199,128,.4);border-radius:8px;padding:1px 4px}
.agent{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.9fr) auto;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.agent:last-child{border-bottom:0}
.stats3{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:11px}
.stats3 span{color:var(--muted)}
.stats3 b{font:600 11px var(--f-mono);text-align:right}
.sbar{height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--azure),#9cc6ff)}
.sbar.m i{background:linear-gradient(90deg,#2fa57c,var(--good))}
.sbar.f i{background:linear-gradient(90deg,#c27a2a,var(--warn))}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pager{display:flex;gap:8px;align-items:center}
@media (max-width:1100px){.agent{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;align-items:center}}
@media (max-width:560px){.agent{grid-template-columns:minmax(0,1fr)}}

/* teknoloji */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.lane{display:flex;flex-direction:column;gap:10px;min-width:0}
.lane>.eyebrow{padding:0 4px}
.tech{position:relative}
.tech.done{background:linear-gradient(160deg,rgba(232,199,128,.13),rgba(232,199,128,.02));border-color:rgba(232,199,128,.3)}
.tech.locked{opacity:.5}
.tech.ready{border-color:rgba(110,169,255,.45);box-shadow:0 0 0 1px rgba(110,169,255,.12),0 10px 30px -14px rgba(110,169,255,.6)}
.cost{display:flex;gap:10px;font:600 12px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.cost .v{color:var(--violet)} .cost .m{color:var(--gold)}
@media (max-width:1200px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lanes{grid-template-columns:minmax(0,1fr)}}

.table{width:100%;border-collapse:collapse;font-size:13px}
.table td{padding:9px 0;border-bottom:1px solid var(--line)}
.table tr:last-child td{border-bottom:0}
.table td:last-child{text-align:right;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.table tr.total td{font-weight:800;border-top:1px solid var(--line-2)}
.ach{display:flex;gap:12px;align-items:center}
.ach .medal{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.ach .medal svg{width:20px;height:20px;stroke:var(--dim)}
.ach.got .medal{background:radial-gradient(circle at 30% 25%,#fff3d1,var(--gold) 45%,var(--gold-deep));border-color:transparent;box-shadow:0 6px 18px -8px rgba(232,199,128,.7)}
.ach.got .medal svg{stroke:var(--on-gold)}
textarea,input[type=text]{width:100%;font:13px var(--f-mono);padding:11px 12px;border-radius:11px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.tog{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px 0;border-bottom:1px solid var(--line)}
.tog input{appearance:none;width:38px;height:22px;border-radius:22px;background:rgba(255,255,255,.1);position:relative;flex:none;cursor:pointer;transition:background .2s}
.tog input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tog input:checked{background:var(--gold-2)}
.tog input:checked::after{transform:translateX(16px);background:#fff8e6}
.tog input:disabled{opacity:.35}
.event{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,rgba(244,184,98,.12),rgba(244,184,98,.025));border:1px solid rgba(244,184,98,.3);display:flex;flex-direction:column;gap:12px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-sm)}
.biggold{font:700 clamp(28px,4vw,42px) var(--f-display);letter-spacing:-.03em;background:linear-gradient(180deg,#fff1cc,var(--gold) 50%,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* modal */
.mback{position:fixed;inset:0;background:rgba(3,5,12,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:80}
.modal{position:relative;background:linear-gradient(180deg,#141b31,#0d1222);border:1px solid rgba(232,199,128,.25);border-radius:24px;max-width:560px;width:100%;padding:26px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.03) inset,0 0 60px -20px rgba(232,199,128,.25)}
.modal h2{font-size:22px}
.judges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.judge{border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;background:rgba(255,255,255,.03)}
.judge small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:28px;font-weight:700}
.judge .sc{font:700 38px var(--f-display);line-height:1;opacity:0;transform:translateY(8px) scale(.9);transition:opacity .35s,transform .35s}
.judge .sc.show{opacity:1;transform:none}
.final{text-align:center;opacity:0;transition:opacity .5s}
.final .n{font:700 64px var(--f-display);letter-spacing:-.04em;line-height:1}
@media (max-width:460px){.judges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(360px,calc(100vw - 32px))}
.toast{background:rgba(20,27,49,.92);backdrop-filter:blur(12px);border:1px solid rgba(232,199,128,.3);color:var(--ink);padding:11px 15px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.toast::before{content:'◆';color:var(--gold);margin-right:8px}

/* alt menü (telefon) */
.bnav{display:none}

@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1080px){.dgrid,.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  body{padding-block:0 96px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{margin-top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;position:static;background:none}
  .mbrand{display:flex;align-items:center;gap:10px;width:100%}
  .mbrand .logo{width:36px;height:36px;border-radius:11px}
  .mbrand .nm{font:600 14px var(--f-display);overflow-wrap:anywhere}
  .mbrand .tl{font-size:10.5px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .crumbs h1{font-size:22px}
  .res{margin-left:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .res .speed{grid-column:1/-1;justify-content:space-between}
  .res .chip:nth-child(5){grid-column:1/-1}
  .res .speed button{flex:1}
  .chip{padding:6px 10px 6px 6px}
  .subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .subtabs button{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--muted);font:700 12.5px var(--f-body);padding:8px 13px;border-radius:20px;cursor:pointer;white-space:nowrap}
  .subtabs button.act{background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--on-gold);border-color:transparent}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(9,12,24,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .bnav button{border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10px var(--f-body);padding:6px 2px;border-radius:12px;cursor:pointer;position:relative;min-width:0}
  .bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav svg{width:21px;height:21px;stroke:currentColor}
  .bnav button.act{color:var(--gold);background:rgba(232,199,128,.08)}
  .bnav .rd{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:minmax(0,1fr)}
  .meters{grid-template-columns:minmax(0,1fr)}
  .hero .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel{padding:14px}
}
@media (prefers-reduced-motion:reduce){.judge .sc,.final{transition:none}}

/* ===== ANA MENÜ ===== */
#menu{position:fixed;inset:0;z-index:70;overflow:auto;background:radial-gradient(1000px 700px at 15% 10%,rgba(124,98,255,.22),transparent 60%),radial-gradient(900px 700px at 100% 100%,rgba(58,132,255,.16),transparent 60%),radial-gradient(700px 500px at 70% 20%,rgba(232,199,128,.09),transparent 70%),var(--bg)}
.inmenu .app,.inmenu .bnav,.inmenu .cards{display:none}
.menu-in{max-width:1200px;margin:0 auto;min-height:100%;padding:calc(48px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center}
.mhero{display:flex;flex-direction:column;gap:12px;min-width:0}
.mtitle{font:700 clamp(38px,5.6vw,68px)/1.02 var(--f-display);letter-spacing:-.045em;margin:4px 0 6px}
.mtitle .biggold{font:inherit}
.orb{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:18px}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(232,199,128,.28)}
.orb i:nth-child(2){inset:-22px;border-color:rgba(232,199,128,.14)}
.orb i:nth-child(3){inset:-46px;border-color:rgba(232,199,128,.07)}
@media (prefers-reduced-motion:no-preference){.orb i{animation:pulse 3.6s ease-out infinite}.orb i:nth-child(2){animation-delay:.6s}.orb i:nth-child(3){animation-delay:1.2s}}
@keyframes pulse{0%{transform:scale(.85);opacity:0}30%{opacity:1}100%{transform:scale(1.08);opacity:0}}
.logo.xl{width:96px;height:96px;border-radius:30px;position:relative;z-index:1}
.logo.xl svg{width:50px;height:50px}
.btn.lg{padding:14px 22px;font-size:14.5px;border-radius:14px}
.mfeat{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12px;color:var(--muted);font-weight:600}
.mfeat span::before{content:'◆';color:var(--gold);margin-right:7px;font-size:9px;vertical-align:1px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;text-align:left;font:inherit;color:inherit}
.slot.last{border-color:rgba(232,199,128,.35);box-shadow:0 0 0 1px rgba(232,199,128,.1),0 18px 40px -22px rgba(232,199,128,.5)}
.slot.empty{border:1px dashed rgba(158,174,222,.22);background:rgba(255,255,255,.015);align-items:center;justify-content:center;text-align:center;cursor:pointer;min-height:200px;gap:8px;transition:border-color .2s,background .2s}
.slot.empty:hover{border-color:rgba(232,199,128,.45);background:rgba(232,199,128,.04)}
.slot .plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(232,199,128,.12)}
.slot .plus svg{width:22px;height:22px;stroke:var(--gold)}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diff{display:flex;flex-direction:column;gap:5px;text-align:left;padding:12px;border-radius:13px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);cursor:pointer;font:inherit;color:inherit}
.diff.act{border-color:var(--gold);background:linear-gradient(160deg,rgba(232,199,128,.16),rgba(232,199,128,.03))}
.diff.act b{color:var(--gold)}
.howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.howto div{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.homebtn{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass);display:grid;place-items:center;cursor:pointer;flex:none}
.homebtn svg{width:19px;height:19px;stroke:var(--gold)}
@media (max-width:900px){.menu-in{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:calc(28px + env(safe-area-inset-top,0px))}.orb{width:92px;height:92px;margin:0 0 10px 30px}.logo.xl{width:72px;height:72px;border-radius:22px}.logo.xl svg{width:38px;height:38px}}
@media (max-width:560px){.slots,.diffs,.howto{grid-template-columns:minmax(0,1fr)}.slot.empty{min-height:120px}}

/* ===== HEDEF & HIZLI EYLEM ===== */
.goal{display:flex;gap:12px;align-items:center;padding:12px;border-radius:13px;background:var(--panel);border:1px solid var(--line)}
.goal.done{border-color:rgba(232,199,128,.45);background:linear-gradient(160deg,rgba(232,199,128,.12),rgba(232,199,128,.02))}
.goal.claimed{opacity:.55}
.goal b{font-size:13.5px}
.gic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(110,169,255,.12)}
.gic svg{width:18px;height:18px;stroke:var(--azure)}
.goal.done .gic{background:rgba(232,199,128,.16)} .goal.done .gic svg{stroke:var(--gold)}
.qas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{display:flex;gap:12px;align-items:center;text-align:left;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:inherit;color:inherit;min-width:0;transition:border-color .15s,background .15s,transform .1s}
.qa:hover:not(:disabled){border-color:rgba(232,199,128,.4);background:var(--panel-2)}
.qa:active:not(:disabled){transform:translateY(1px)}
.qa:disabled{opacity:.42;cursor:not-allowed}
.qa b{display:block;font-size:13px}
.qic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,rgba(232,199,128,.22),rgba(232,199,128,.06))}
.qic svg{width:18px;height:18px;stroke:var(--gold)}
@media (max-width:560px){.qas{grid-template-columns:minmax(0,1fr)}}

/* karne kartı */
.cards{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:85;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 32px))}
.rcard{background:rgba(17,23,42,.94);backdrop-filter:blur(14px);border:1px solid rgba(232,199,128,.3);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:opacity .5s,transform .5s}
@media (prefers-reduced-motion:no-preference){.rcard{animation:slidein .45s ease-out}}
@keyframes slidein{from{opacity:0;transform:translateY(12px)}}
.rcard.out{opacity:0;transform:translateY(8px)}
.rcard .x{border:0;background:rgba(255,255,255,.06);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;flex:none}
.rcard b{display:block;font-size:13.5px}
.jrow{display:flex;gap:6px}
.jrow span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);font:700 13px var(--f-display)}
.rscore{font:700 30px var(--f-display);letter-spacing:-.03em}
@media (max-width:900px){.cards{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* ===== AR-GE LAB ===== */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0}
.tlane{display:flex;flex-direction:column;gap:6px;min-width:0}
.tlane>.eyebrow{padding:0 2px 2px}
.tnode{position:relative;display:flex;gap:9px;align-items:center;text-align:left;padding:8px 9px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:inherit;color:inherit;min-width:0;transition:border-color .15s,background .15s}
.tnode:hover{border-color:var(--line-2);background:var(--panel-2)}
.tnode .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05)}
.tnode .ti svg{width:16px;height:16px;stroke:var(--muted)}
.tnode .tx{min-width:0;display:flex;flex-direction:column}
.tnode b{font-size:12px;line-height:1.25;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .tx span{font:500 10.5px var(--f-mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode.done{background:linear-gradient(160deg,rgba(232,199,128,.13),rgba(232,199,128,.03));border-color:rgba(232,199,128,.28)}
.tnode.done .ti{background:linear-gradient(160deg,#f2d79d,var(--gold-2))} .tnode.done .ti svg{stroke:var(--on-gold)}
.tnode.done .tx span{color:var(--gold)}
.tnode.ready{border-color:rgba(110,169,255,.5);box-shadow:0 0 0 1px rgba(110,169,255,.12),0 8px 24px -14px rgba(110,169,255,.7)}
.tnode.ready .ti{background:rgba(110,169,255,.16)} .tnode.ready .ti svg{stroke:var(--azure)}
.tnode.locked{opacity:.45}
.tnode.sel{outline:2px solid var(--gold);outline-offset:1px}
.rdot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--azure);box-shadow:0 0 8px var(--azure)}
.tdetail{position:sticky;top:110px;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#151c33,#0f1527);border:1px solid var(--line-2);min-width:0}
.tbig{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06)}
.tbig svg{width:26px;height:26px;stroke:var(--muted)}
.tbig.done{background:radial-gradient(circle at 30% 25%,#fff3d1,var(--gold) 45%,var(--gold-deep))} .tbig.done svg{stroke:var(--on-gold)}
.tbig.ready{background:rgba(110,169,255,.16)} .tbig.ready svg{stroke:var(--azure)}
.tag{color:var(--muted);background:rgba(255,255,255,.06)}
.need{display:flex;flex-direction:column;gap:5px}
.reqs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reqs .eyebrow{width:100%}
.req{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:600 11.5px var(--f-body);color:var(--muted);cursor:pointer}
.req svg{width:13px;height:13px;stroke:currentColor}
.req.ok{color:var(--good);border-color:rgba(82,216,166,.3)}
@media (max-width:1250px){.lab{grid-template-columns:minmax(0,1fr)}.tdetail{position:static;order:-1}}
@media (max-width:700px){.tree{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== TESİSLER ===== */
.ofc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch}
.ofacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ofact{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.ofact small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.ofact b{font:600 15px var(--f-mono)}
.upcard{display:flex;flex-direction:column;gap:11px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(110,169,255,.10),rgba(110,169,255,.02));border:1px solid rgba(110,169,255,.24)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.deltas span{font:600 11.5px var(--f-mono);padding:4px 8px;border-radius:7px;background:rgba(82,216,166,.1);color:var(--good)}
.deltas span.bad{background:rgba(255,109,130,.1);color:var(--bad)}
.timeline{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:0;margin-top:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.step{position:relative;display:flex;flex-direction:column;gap:3px;padding:0 10px 0 0;min-width:0}
.step::before{content:'';position:absolute;top:13px;left:28px;right:0;height:2px;background:var(--line-2)}
.step:last-child::before{display:none}
.step.past::before{background:linear-gradient(90deg,var(--good),rgba(82,216,166,.4))}
.sdot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-mono);background:var(--panel-2);border:1px solid var(--line-2);color:var(--dim);margin-bottom:6px}
.sdot svg{width:14px;height:14px;stroke:#062016}
.step.past .sdot{background:var(--good);border-color:transparent}
.step.now .sdot{background:linear-gradient(180deg,#f2d79d,var(--gold-2));color:var(--on-gold);border-color:transparent;box-shadow:0 0 0 4px rgba(232,199,128,.15)}
.step b{font-size:12px;line-height:1.25}
.step.now b{color:var(--gold)}
.step:not(.past):not(.now){opacity:.6}
@media (max-width:1000px){.ofc{grid-template-columns:minmax(0,1fr)}}

/* ===== BAŞARIMLAR ===== */
.achtop{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%}
.ring>div{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:36px;gap:3px}
.ring b{font:700 26px var(--f-display);letter-spacing:-.03em}
.ring span{font:600 12px var(--f-mono);color:var(--muted)}
.rkrow{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font:600 11.5px var(--f-body);color:var(--muted)}
.rkrow span{display:inline-flex;align-items:center;gap:6px}
.rkrow i{width:9px;height:9px;border-radius:3px;background:var(--rc)}
.astats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.astat{padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}

/* =========================== YARDIMCILAR =========================== */
const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.random()*(b-a);
const RI = (a,b) => Math.floor(R(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function short(n){
  const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2).replace('.',',')+' Mr';
  if(a>=1e6) return (n/1e6).toFixed(2).replace('.',',')+' Mn';
  if(a>=1e4) return (n/1e3).toFixed(1).replace('.',',')+' B';
  return Math.round(n).toLocaleString('tr-TR');
}
const fm = n => (n<0?'−':'')+'₺'+short(Math.abs(n));
const fn = n => short(n);
const pct = v => Math.round(v)+'%';

let S = null;                       // oyun durumu

function perk(id){ return (S && S.legacy.spent[id]) || 0; }
function perkOf(L,id){ return (L.spent && L.spent[id]) || 0; }
function tierIdx(){ let t=0; TIERS.forEach((x,i)=>{ if(S.rep>=x.rep) t=i; }); return t; }
function has(id){ return !!S.techs[id]; }
function slots(){ return 2 + S.office + (has('autorenew')?1:0); }

function blankAcc(){ return {d:0,a:0,r:0,sl:0,cs:0,rev:0,cost:0}; }
function newGame(name, legacy, diff){ diff = diff??0;
  const L = legacy || {points:0,total:0,spent:{},ipos:0};
  S = { v:1, name, day:0, money:20000 + perkOf(L,'angel')*25000 + DIFFS[diff].money, diff, goals:[], goalsDay:0, eom:null, reviewModal:false, branches:{}, loyal:{}, tempo:1, adUntil:0, rivals:null, rep:0, rp:0,
    agents:[], candidates:[], candDay:7, contracts:[], offers:[], offerDay:5,
    office: perkOf(L,'hq'), techs:{}, support:{lead:0,qa:0,wfm:0},
    legacy:L, ach:{}, stats:{answered:0,resolved:0,earned:0,signed:0,done:0,best:0,bestFcr:0,hired:0,trained:0,good7:0,goals:0,vip:0,streakBest:0},
    speed:1, log:[], hist:[], dayAcc:blankAcc(), fx:[], inbox:[], nextEvent:25, tut:null, tutDone:false,
    auto:{hire:true,renew:true,accept:true}, loan:0, negDays:0, nid:1, showReviews:true, lastTs:Date.now() };
  if(legacy){ for(const a of ACH){ /* başarımlar kalıcı */ } S.ach = legacy.ach || {}; }
  S.agents.push(genAgent(0,true), genAgent(0,true));
  S.candidates = [genAgent(0),genAgent(0),genAgent(0),genAgent(0)];
  S.offers = [genOffer(0,true), genOffer(0), genOffer(0), genOffer(0)];
  S.lastMonth=0; S.rivals=genRivals(); genGoals();
  addLog(`${S.name} kapılarını açtı. İlk sözleşmeni Teklif Pazarı'ndan seç.`);
  UI.dirty = true;
}
function genAgent(tier, starter){
  const base = 30 + tier*9 + perk('mentor')*5 + (starter?4:0);
  const st = () => clamp(Math.round(base + R(-14,14)),5,95);
  const spd=st(), emp=st(), kno=st();
  const unlocked = SECTORS.filter(s=>s.t<=tier);
  return { id:S?S.nid++:0, name:pick(FIRST)+' '+pick(LAST), spd, emp, kno, lvl:1, xp:0,
    sal: Math.round((3000 + (spd+emp+kno)*22)/100)*100, morale:70, fat:0, bonus:0, training:null,
    spec: Math.random()<.5 ? pick(unlocked).id : null };
}
function genOfferBase(ti, easy){
  const t = TIERS[ti];
  const pool = SECTORS.filter(s=>s.t<=ti);
  const near = pool.filter(s=>s.t>=ti-1);
  const sec = Math.random()<.7 && near.length ? pick(near) : pick(pool);
  const kind = !easy && Math.random()<.12 ? 'kampanya' : 'standart';
  const diff = easy ? 0 : (Math.random()<.65?0:Math.random()<.7?1:2);
  let cpd = Math.round(R(...t.cpd)), pay = R(...t.pay), dur = RI(...t.dur);
  if(easy){ cpd = RI(24,32); pay = 16; dur = 20; }
  if(kind==='kampanya'){ cpd = Math.round(cpd*1.8); pay*=1.2; dur = Math.max(8,Math.round(dur/2)); }
  pay *= 1 + diff*.15;
  return { easy:!!easy, id:S.nid++, co: pick(PREF)+' '+pick(sec.suf), sector:sec.id, tier:ti, kind, diff,
    cpd, pay: Math.round(pay*2)/2, dur,
    slT: easy?65:RI(...t.sl), fcrT: easy?50:RI(...t.fcr)+diff*2, csT: easy?60:RI(...t.cs)+diff*2,
    exp: S.day + RI(7,13) };
}
function secName(id){ const s=SECTORS.find(x=>x.id===id); return s?s.n:'—'; }

function eff(){
  const E={speed:1,cap:1,fcr:0,csat:0,sl:0,fat:0,xp:1,train:1,morale:0,auto:0,spec:1,rp:1};
  for(const t of TECHS){ if(!S.techs[t.id]) continue; const f=t.fx;
    if(f.speed)E.speed+=f.speed; if(f.cap)E.cap+=f.cap; if(f.fcr)E.fcr+=f.fcr; if(f.csat)E.csat+=f.csat; if(f.sl)E.sl+=f.sl;
    if(f.fat)E.fat+=f.fat; if(f.xp)E.xp+=f.xp; if(f.train)E.train-=f.train; if(f.morale)E.morale+=f.morale; if(f.auto)E.auto+=f.auto; if(f.spec)E.spec+=f.spec; }
  const cov = k => coverage(k);
  E.morale += 12*cov('lead'); E.xp += .2*cov('lead');
  E.fcr += .05*cov('qa'); E.rp += .5*cov('qa');
  E.cap += .10*cov('wfm'); E.sl += 4*cov('wfm');
  E.rp *= 1 + perk('lab')*.2;
  E.rev = (1 + S.legacy.total*.04)*DIFFS[S.diff??1].rev; E.fatM = DIFFS[S.diff??1].fat; { const TP=TEMPO[S.tempo??1]; E.cap*=TP.cap; E.fatM*=TP.fat; E.morale+=TP.mor; }
  E.repM = 1 + perk('brand')*.15;
  return E;
}
function coverage(k){ const n=Math.max(1,S.agents.length); return Math.min(1, S.support[k]*SUPPORT[k].per/n); }
function tmp(kind, cid){ let m=1; for(const f of S.fx){ if(f.k===kind && (cid===undefined || f.cid===undefined || f.cid===cid)) m*=f.m; } return m; }
function addFx(k,m,days,cid){ S.fx.push({k,m,until:S.day+days,cid}); }
function agentCap(a,E){
  return 28*(0.6+a.spd*0.008)*(1+(a.lvl-1)*0.03)*E.speed*(0.8+clamp(a.morale,0,100)/500)*(1-a.fat/400);
}

/* =========================== SİMÜLASYON =========================== */
function step(dt){
  const E = eff();
  const day0 = Math.floor(S.day);
  let cap=0,n=0,sEmp=0,sKno=0,sFat=0; const spec={};
  for(const a of S.agents){
    if(a.training){
      if(S.day>=a.training.until){ if(a.training.stat==='rest'){ a.fat=0; a.bonus+=5; } else if(a.training.stat==='spec'){ a.spec=a.training.spec; if(!OFFLINE) addLog(`${a.name} artık ${secName(a.spec)} uzmanı.`,'good'); } else { const g=RI(6,10); a[a.training.stat]=Math.min(100,a[a.training.stat]+g); if(!OFFLINE) addLog(`${a.name} eğitimi bitirdi (+${g}).`); } a.training=null; UI.dirty=true; UI.deskKey=''; }
      else { a.fat=Math.max(0,a.fat-20*dt); continue; }
    }
    a._c = agentCap(a,E); cap+=a._c; n++; sEmp+=a.emp; sKno+=a.kno; sFat+=a.fat;
    if(a.spec) spec[a.spec]=(spec[a.spec]||0)+1;
  }
  cap *= E.cap * tmp('cap');
  const avgEmp=n?sEmp/n:0, avgKno=n?sKno/n:0, avgFat=n?sFat/n:0;
  let totalD=0;
  for(const c of S.contracts){
    const base = c.cpd*tmp('demand',c.id);
    const auto = base*E.auto;
    const draw = c.pool*Math.min(1,dt*1.5);
    c.pool -= draw;
    c._auto = auto*dt; c._d = (base-auto)*dt + draw; totalD += c._d;
  }
  const capDt = cap*dt;
  const occ = totalD>0 ? (capDt>0 ? totalD/capDt : 9) : 0;
  const slOf = o => clamp(clamp(100*(1-Math.max(0,o-0.7)*1.6),2,97)+E.sl,0,99.5);
  const afOf = (o,s) => Math.min(1,1/Math.max(o,1e-9))*(1-(100-s)/100*0.12);
  // Öncelikli hatlar kapasiteyi önce kullanır, kalanlar geri kalan kapasiteyi paylaşır
  const dP = S.contracts.reduce((s,c)=>s+(c.prio?c._d:0),0), dN = totalD-dP, split = dP>0 && dN>0;
  const occP = split ? (capDt>0 ? dP/capDt+0.08 : 9) : occ;
  const occN = split ? (capDt>dP ? dN/(capDt-dP) : 9) : occ;
  const slP = slOf(occP), slN = slOf(occN), afP = afOf(occP,slP), afN = afOf(occN,slN);
  const sl = totalD>0 ? (split ? (dP*slP+dN*slN)/totalD : slN) : 100;
  let rev=0,ans=0,res=0,csw=0,dem=0;
  for(const c of S.contracts){
    const P = split && c.prio, slc = totalD>0 ? (P?slP:slN) : 100, af = totalD>0 ? (P?afP:afN) : 1;
    const d=c._d, a=d*af, ab=d-a;
    const share = n ? (spec[c.sector]||0)/n : 0;
    const fcr = clamp(0.42+avgKno*0.0035+E.fcr+share*0.12*E.spec-avgFat*0.001-c.diff*0.03,0.25,0.97);
    const cs = clamp(53+avgEmp*0.35+(slc-80)*0.35+(fcr*100-70)*0.5+E.csat-avgFat*0.12-c.diff*3,5,99);
    const r=a*fcr; c.pool += (a-r)*0.4 + ab*0.3;
    const money = (a + c._auto*0.4)*c.pay*E.rev;
    const A=c.acc; A.d+=d; A.a+=a+c._auto; A.r+=r+c._auto; A.sl+=slc*d; A.cs+=cs*a; A.rev+=money;
    c._fcr=fcr; c._cs=cs; c._sl=slc;
    rev+=money; ans+=a+c._auto; res+=r+c._auto; csw+=cs*a; dem+=d;
  }
  // giderler
  let sal=0; for(const a of S.agents) sal+=a.sal;
  for(const k in SUPPORT) sal += S.support[k]*SUPPORT[k].sal;
  const cost = (sal/30 + office().rent + S.loan*0.0012)*dt;
  // temsilciler
  const util = Math.min(1.15,occ);
  const lead = 0;
  for(const a of S.agents){
    if(a.training) continue;
    const handled = a._c*dt*Math.min(1,occ);
    a.xp += handled*E.xp;
    const need = 300*Math.pow(a.lvl,1.4);
    if(a.xp>=need){ a.xp-=need; a.lvl++; const k=pick(['spd','emp','kno']); a[k]=Math.min(100,a[k]+2); const k2=pick(['spd','emp','kno']); a[k2]=Math.min(100,a[k2]+1); a.sal=Math.round(a.sal*1.04/50)*50; if(!OFFLINE&&a.lvl%5===0) addLog(`${a.name} seviye ${a.lvl} oldu.`); UI.dirty=true; }
    const df = (util-0.75)*16*dt;
    a.fat = clamp(a.fat + (df>0 ? df*(1-Math.min(.8,E.fat))*E.fatM : df),0,100); a.mx=(a.mx||0)+handled;
    a.bonus += (a.bonus>0?-1:a.bonus<0?1:0)*Math.min(Math.abs(a.bonus),1.2*dt);
    const target = 55 + office().morale + E.morale - a.fat*0.45 + a.bonus + (S.money<0?-15:0);
    a.morale += (clamp(target,0,100)-a.morale)*Math.min(1,0.15*dt);
  }
  { const bInc=branchIncome()*E.rev*dt; rev+=bInc; S._bInc=bInc/Math.max(dt,1e-9); }
  S.money += rev - cost;
  S.rp += res/40*E.rp;
  S.stats.answered += ans; S.stats.resolved += res; S.stats.earned += rev;
  const D=S.dayAcc; D.d+=dem; D.a+=ans; D.r+=res; D.sl+=sl*dem; D.cs+=csw; D.rev+=rev; D.cost+=cost;
  S.day += dt;
  UI.live = {sl, occ, fcr: ans>0?res/ans:0, csat: (ans>0?csw/Math.max(1e-9,ans-S.contracts.reduce((s,c)=>s+c._auto,0)):0), cap, dem: dt>0?totalD/dt:0, rev: dt>0?rev/dt:0, cost: dt>0?cost/dt:0, n, aht: n? Math.round(300/E.speed*(1+avgFat/300)) : 0, pool:S.contracts.reduce((s,c)=>s+c.pool,0)};
  for(const c of [...S.contracts]) if(S.day>=c.start+c.dur) finishContract(c);
  if(Math.floor(S.day)>day0) newDay();
}

function newDay(){
  const D=S.dayAcc;
  const h={d:Math.floor(S.day)-1, calls:D.d, ans:D.a, fcr:D.a>0?D.r/D.a*100:0, sl:D.d>0?D.sl/D.d:null, profit:D.rev-D.cost};
  S.hist.push(h); if(S.hist.length>90) S.hist.shift();
  if(D.a>20) S.stats.bestFcr=Math.max(S.stats.bestFcr,h.fcr);
  S.dayAcc=blankAcc();
  const ti=tierIdx();
  // teklifler
  const before=S.offers.length;
  S.offers = S.offers.filter(o=>o.exp>S.day);
  if(S.day>=S.offerDay){
    while(S.offers.length<(adActive()?8:6)){ const t = Math.random()<.6?ti:RI(Math.max(0,ti-1),ti); if(t===4&&!has('global')) S.offers.push(genOffer(3)); else S.offers.push(genOffer(t)); }
    S.offerDay = S.day + (adActive()?3:5); if(!OFFLINE) addLog('Yeni sözleşme teklifleri geldi.');
  }
  if(S.offers.length!==before) UI.dirty=true;
  if(S.day>=S.candDay){ S.candidates=[]; for(let i=0;i<4+Math.min(4,S.office);i++) S.candidates.push(genAgent(ti)); S.candDay=S.day+7; UI.dirty=true; }
  // istifalar
  for(const a of [...S.agents]){ if(a.morale<25 && Math.random()<.05){ S.agents.splice(S.agents.indexOf(a),1); addLog(`${a.name} düşük moral yüzünden istifa etti.`,'bad'); UI.dirty=true; } }
  S.fx = S.fx.filter(f=>f.until>S.day);
  // olay kutusu
  for(const it of [...S.inbox]) if(S.day>=it.until){ resolveEvent(it, EVENTS.find(e=>e.id===it.eid).def, true); }
  if(!OFFLINE && S.tut==null && S.day>=S.nextEvent){ spawnEvent(); S.nextEvent = S.day + RI(12,24); }
  autoHire(); autoAccept(); monthly(); goalsTick(); rivalsTick();
  // iflas
  S.negDays = S.money<0 ? S.negDays+1 : 0;
  if(S.negDays===10) addLog('Kasa 10 gündür ekside. 30 güne ulaşırsa şirket iflas eder.','bad');
  if(S.negDays>=30) bankrupt();
  checkAch();
  const nt=tierIdx(); if(UI.lastTier!==undefined && nt>UI.lastTier){ const gift=Math.round(10000*TIERS[nt].mult); S.money+=gift; addLog(`Seviye atladın: ${TIERS[nt].title}. Yatırımcılardan ${fm(gift)} hediye.`,'good'); if(!OFFLINE) queueModal({type:'tierup',t:nt,gift}); }
  UI.lastTier=nt;
}

function finishContract(c){
  const A=c.acc;
  const sl=A.d>0?A.sl/A.d:0, fcr=A.a>0?A.r/A.a*100:0, cs=A.a>0?A.cs/Math.max(1e-9,A.a):0;
  const r1=sl/c.slT, r2=fcr/c.fcrT, r3=cs/c.csT;
  const base = 0.4*Math.min(r1,1.15)+0.3*Math.min(r2,1.15)+0.3*Math.min(r3,1.15);
  const score = clamp(7+(base-1)*20,1,10);
  const judges = JUDGES.map(()=>clamp(Math.round(score+R(-1,1)),1,10));
  const final = judges.reduce((s,x)=>s+x,0)/4;
  let bonus=0;
  if(final>=7) bonus = A.rev*0.25*(final-6)/4;
  else if(final<5) bonus = -A.rev*0.15*(5-final)/4;
  let dRep = Math.round((final-5)*6*TIERS[c.tier].mult);
  if(dRep>0) dRep=Math.round(dRep*eff().repM);
  S.money += bonus; S.rep = Math.max(0,S.rep+dRep);
  S.stats.done++; S.stats.best=Math.max(S.stats.best,Math.round(final)); if(final>=7) S.stats.good7=(S.stats.good7||0)+1; if(final>=8) addLoyal(c);
  S.contracts.splice(S.contracts.indexOf(c),1);
  const msg = `${c.co} sözleşmesi bitti: ${final.toFixed(1).replace('.',',')}/10 · ${bonus>=0?'prim':'ceza'} ${fm(Math.abs(bonus))} · itibar ${dRep>=0?'+':''}${dRep}`;
  addLog(msg, final>=7?'good':final<5?'bad':'');
  let renewed=false;
  if(S.auto.renew && has('autorenew') && final>=6){
    const nc = {...c, id:S.nid++, cpd:Math.round(c.cpd*1.1), pay:Math.round(c.pay*1.05*2)/2, start:S.day, acc:blankAcc(), pool:0};
    S.contracts.push(nc); renewed=true; addLog(`${c.co} sözleşmeyi yeniledi (+%10 hacim).`);
  }
  if(!OFFLINE){ const RV={type:'review', c, sl, fcr, cs, judges, final, bonus, dRep, renewed}; if(S.reviewModal) queueModal(RV); else reviewCard(RV); }
  UI.dirty=true;
}

function acceptOffer(o, silent){
  if(S.contracts.length>=slots()) return;
  S.offers.splice(S.offers.indexOf(o),1);
  S.contracts.push({...o, start:S.day, acc:blankAcc(), pool:0});
  S.stats.signed++;
  if(!silent) addLog(`${o.co} ile sözleşme imzalandı (${o.dur} gün, ${o.cpd} çağrı/gün).`,'good');
  else addLog(`Hesap yöneticisi ${o.co} sözleşmesini imzaladı.`);
  UI.dirty=true;
}
function autoAccept(){
  if(!S.auto.accept || !has('autorenew') || !UI.live) return;
  if(S.contracts.length>=slots()) return;
  const spare = UI.live.cap - UI.live.dem;
  const fit = S.offers.filter(o=>o.cpd*1.35 < spare && o.diff<2).sort((a,b)=>b.cpd*b.pay-a.cpd*a.pay);
  if(fit.length) acceptOffer(fit[0],true);
}
function autoHire(){
  if(!S.auto.hire || !has('autohire') || !UI.live) return;
  if(S.agents.length>=office().seats) return;
  if(UI.live.occ < 0.72) return;
  const c = [...S.candidates].sort((a,b)=>(b.spd+b.emp+b.kno)/b.sal-(a.spd+a.emp+a.kno)/a.sal)[0];
  if(c && S.money > c.sal*3){ hire(c,true); }
}
function hire(c, auto){
  if(S.agents.length>=office().seats) return;
  S.candidates.splice(S.candidates.indexOf(c),1);
  c.hired=S.day; S.agents.push(c); S.stats.hired=(S.stats.hired||0)+1;
  addLog(auto?`İK sistemi ${c.name} adlı temsilciyi işe aldı.`:`${c.name} ekibe katıldı.`);
  UI.dirty=true;
}

  if(auto) addLog(`"${e.t}" için süre doldu, varsayılan seçenek uygulandı.`);

}

/* =========================== BAŞARIM / İFLAS / HALKA ARZ =========================== */
function checkAch(){
  for(const [id,n,d,f] of ACH){ if(!S.ach[id] && f(S)){ S.ach[id]=Math.floor(S.day)+1; addLog(`Başarım açıldı: ${n}`,'good'); if(!OFFLINE) toast(`Başarım: ${n}`); UI.dirty=true; } }
}
function bankrupt(){
  addLog('Şirket iflas etti.','bad');
  queueModal({type:'bankrupt'});
  S.speed=0;
}
function ipoPoints(){ return Math.floor(Math.sqrt(S.stats.earned/250000)) + Math.floor(S.rep/1500); }
function valuation(){
  const recent=S.hist.slice(-30); const avg=recent.length?recent.reduce((s,h)=>s+h.profit,0)/recent.length:0;
  return Math.max(0, S.money - S.loan + OFFICES[S.office].cost*0.5 + Math.max(0,avg)*365*2 + S.rep*1000 + Object.keys(S.techs).length*20000);
}
function doIPO(){
  const pts=ipoPoints(); const L=S.legacy; L.points+=pts; L.total+=pts; L.ipos++; L.ach=S.ach;
  const name=S.name;
  newGame(name, L, S.diff??1);
  addLog(`Halka arz tamamlandı: ${pts} miras puanı kazandın. Yeni şirket tüm gelirlerde +%${Math.round(L.total*4)} avantajla başlıyor.`,'good');
  checkAch();
}

/* =========================== KAYIT =========================== */
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code){ const s=JSON.parse(decodeURIComponent(escape(atob(code.trim())))); if(!s||s.v!==1) throw new Error('bad'); return s; }

function offlineCatchup(){
  const el=(Date.now()-(S.lastTs||Date.now()))/1000;
  if(el<30) return;
  const days=Math.min(el/DAY_SEC, 240);
  const m0=S.money, r0=S.rep, c0=S.stats.answered, d0=S.stats.done;
  OFFLINE=true;
  let left=days; while(left>0){ const dt=Math.min(.25,left); step(dt); left-=dt; }
  OFFLINE=false;
  queueModal({type:'offline', days, money:S.money-m0, rep:S.rep-r0, calls:S.stats.answered-c0, done:S.stats.done-d0, capped: el/DAY_SEC>240});
}

function addLog(t,cls){ if(!S) return; S.log.unshift({d:Math.floor(S.day),t,c:cls||''}); if(S.log.length>60) S.log.pop(); UI.logDirty=true; }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; $('#toasts').appendChild(el); while($('#toasts').children.length>3) $('#toasts').firstChild.remove(); setTimeout(()=>el.remove(),3800); }


/* =========================== KARİYER SLOTLARI =========================== */
let META={slots:Array(SLOT_N).fill(null),last:null};
const MEM={};
function loadMeta(){
  try{ const t=localStorage.getItem(META_KEY); if(t){ const m=JSON.parse(t); if(m&&Array.isArray(m.slots)){ while(m.slots.length<SLOT_N) m.slots.push(null); META=m; } } }catch(e){}
  // eski tek kayıtlı sürümden taşı
  try{ const old=localStorage.getItem(SAVE_KEY); if(old && META.slots.every(x=>!x)){ const s=migrate(JSON.parse(old)); localStorage.setItem('cmt_slot_0',JSON.stringify(s)); META.slots[0]=metaOf(s); META.last=0; saveMeta(); localStorage.removeItem(SAVE_KEY); } }catch(e){}
}
function saveMeta(){ try{ localStorage.setItem(META_KEY,JSON.stringify(META)); }catch(e){} }
function metaOf(s){ const prev=S; S=s; const m={name:s.name,tier:tierIdx(),money:s.money,day:s.day,ts:Date.now(),diff:s.diff??1,ipos:s.legacy.ipos,agents:s.agents.length}; S=prev; return m; }
function migrate(s){
  s.goals=s.goals||[]; s.goalsDay=s.goalsDay||0; s.diff=s.diff??1; s.eom=s.eom||null; s.reviewModal=!!s.reviewModal;
  for(const k of ['hired','trained','good7','goals','vip','streakBest']) s.stats[k]=s.stats[k]||0;
  s.branches=s.branches||{}; s.loyal=s.loyal||{}; s.tempo=s.tempo??1; s.adUntil=s.adUntil||0;
  if(!s.rivals){ const p=S; S=s; s.rivals=genRivals(); for(const r of s.rivals) r.rep+=r.g*s.day; S=p; }
  return s;
}
function save(){
  if(!S||UI.slot==null) return;
  S.lastTs=Date.now(); MEM[UI.slot]=S;
  try{ localStorage.setItem('cmt_slot_'+UI.slot, JSON.stringify(S)); }catch(e){}
  META.slots[UI.slot]=metaOf(S); META.last=UI.slot; saveMeta();
}
function loadSlot(i){
  try{ const t=localStorage.getItem('cmt_slot_'+i); if(t){ const s=JSON.parse(t); if(s&&s.v===1) return migrate(s); } }catch(e){}
  return MEM[i]||null;
}
function deleteSlot(i){ try{ localStorage.removeItem('cmt_slot_'+i); }catch(e){} delete MEM[i]; META.slots[i]=null; if(META.last===i) META.last=null; saveMeta(); }

/* =========================== HEDEFLER =========================== */
function goalCounter(t){ const s=S.stats;
  return t==='answer'?s.answered:t==='earn'?s.earned:t==='done'?s.done:t==='good7'?(s.good7||0):t==='hired'?(s.hired||0):t==='trained'?(s.trained||0):t==='tech'?Object.keys(S.techs).length:t==='vip'?(s.vip||0):0; }
function niceRound(n){ n=Math.max(1,n); const p=Math.pow(10,Math.max(0,Math.floor(Math.log10(n))-1)); return Math.round(n/p)*p; }
function genGoals(){
  const ti=tierIdx(), cap=Math.max(40,UI.live?UI.live.cap:45), pay=(TIERS[ti].pay[0]+TIERS[ti].pay[1])/2;
  const dayRev=cap*0.8*pay;
  const opts=[
    {t:'answer',n:x=>`${fn(x)} çağrı yanıtla`,target:niceRound(cap*0.8*4),r:{money:niceRound(dayRev*1.2)}},
    {t:'earn',n:x=>`${fm(x)} ciro yap`,target:niceRound(dayRev*5),r:{money:niceRound(dayRev*1.5)}},
    {t:'done',n:()=>'Bir sözleşmeyi tamamla',target:1,r:{money:niceRound(dayRev*1.5),rep:Math.round(3*TIERS[ti].mult)}},
    {t:'good7',n:()=>'Bir sözleşmeyi 7+ karneyle bitir',target:1,r:{rep:Math.round(6*TIERS[ti].mult),rp:10*(ti+1)}},
    {t:'trained',n:x=>`${x} eğitim başlat`,target:2,r:{rp:12*(ti+1)}},
    {t:'vip',n:()=>'Bir VIP çağrıyı yanıtla',target:1,r:{money:niceRound(dayRev)}},
  ];
  if(S.agents.length<office().seats) opts.push({t:'hired',n:()=>'Bir temsilci işe al',target:1,r:{money:niceRound(dayRev)}});
  if(TECHS.some(t=>!has(t.id)&&t.req.every(has))) opts.push({t:'tech',n:()=>'Bir teknoloji geliştir',target:1,r:{money:niceRound(dayRev*2)}});
  const pick3=opts.sort(()=>Math.random()-.5).slice(0,3);
  S.goals=pick3.map(o=>({id:S.nid++,t:o.t,label:o.n(o.target),target:o.target,base:goalCounter(o.t),r:o.r,claimed:false}));
  S.goalsDay=S.day+12; UI.dirty=true;
}
function goalProg(g){ return clamp(goalCounter(g.t)-g.base,0,g.target); }
function goalDone(g){ return goalProg(g)>=g.target; }
function rewardStr(r){ const p=[]; if(r.money)p.push('+'+fm(r.money)); if(r.rp)p.push(`+${r.rp} AR-GE`); if(r.rep)p.push(`+${r.rep} itibar`); return p.join(' · '); }
function claimGoal(g,silent){
  if(!g||g.claimed||!goalDone(g)) return;
  g.claimed=true; S.money+=g.r.money||0; S.rp+=g.r.rp||0; S.rep+=g.r.rep||0; S.stats.goals=(S.stats.goals||0)+1;
  if(!silent) toast(`Hedef tamamlandı: ${rewardStr(g.r)}`);
  addLog(`Hedef ödülü alındı: ${g.label} (${rewardStr(g.r)}).`,'good');
  if(S.goals.every(x=>x.claimed)){ genGoals(); if(!silent) addLog('Yeni hedefler hazır.'); }
  UI.dirty=true;
}
function goalsTick(){
  if(!S.goals || !S.goals.length){ genGoals(); return; }
  if(OFFLINE) S.goals.filter(g=>!g.claimed&&goalDone(g)).forEach(g=>claimGoal(g,true));
  if(S.day>=S.goalsDay){ S.goals.filter(g=>!g.claimed&&goalDone(g)).forEach(g=>claimGoal(g,true)); genGoals(); }
}

/* =========================== AYIN ÇALIŞANI =========================== */
function monthly(){
  const m=Math.floor(S.day/30);
  if(S.lastMonth===undefined){ S.lastMonth=m; return; }
  if(m<=S.lastMonth) return;
  S.lastMonth=m;
  if(S.agents.length>=2){
    const w=[...S.agents].sort((a,b)=>(b.mx||0)-(a.mx||0))[0];
    if((w.mx||0)>0){ w.bonus+=25; S.agents.forEach(a=>{ if(a!==w) a.bonus+=4; });
      S.eom={id:w.id,name:w.name,calls:Math.round(w.mx)};
      addLog(`Ayın çalışanı: ${w.name} (${fn(w.mx)} çağrı). Ekibin morali yükseldi.`,'good'); if(!OFFLINE) toast(`Ayın çalışanı: ${w.name}`); }
  }
  S.agents.forEach(a=>a.mx=0); UI.dirty=true;
}

/* =========================== HIZLI EYLEMLER =========================== */
function qaFill(){
  let n=0;
  while(S.agents.length<office().seats && S.candidates.length){
    const c=[...S.candidates].sort((a,b)=>(b.spd+b.emp+b.kno)/b.sal-(a.spd+a.emp+a.kno)/a.sal)[0];
    if(S.money<c.sal*2) break; hire(c); n++;
  }
  toast(n?`${n} temsilci işe alındı`:(S.agents.length>=office().seats?'Boş masa yok':'Uygun aday ya da bütçe yok'));
}
function qaRest(){
  let n=0; for(const a of S.agents) if(!a.training && a.fat>45){ a.training={stat:'rest',until:S.day+1}; n++; }
  UI.deskKey=''; if(n) addLog(`${n} yorgun temsilci 1 günlük molaya çıktı.`);
  toast(n?`${n} kişi 1 günlük molaya çıktı`:'Molaya ihtiyacı olan kimse yok');
}
function qaSign(){
  if(S.contracts.length>=slots()){ toast('Boş hat yok. Tesisini büyüterek yeni hat açabilirsin.'); return; }
  const L=UI.live||{cap:0,dem:0}; const spare=L.cap*0.85-L.dem;
  const fit=S.offers.filter(o=>o.cpd*1.15<=spare).sort((a,b)=>b.cpd*b.pay*b.dur-a.cpd*a.pay*a.dur);
  const o=fit[0]; if(!o){ toast('Kapasitene uyan teklif yok. Önce ekibi büyüt.'); return; }
  acceptOffer(o); toast(`${o.co} ile sözleşme imzalandı`);
}
function qaTrain(){
  let n=0,cost=0;
  for(const a of S.agents){ if(a.training||a.fat>60) continue; const c=trainCost(a); if(S.money-c<5000) break;
    const st=['spd','emp','kno'].sort((x,y)=>a[x]-a[y])[0]; S.money-=c; cost+=c; a.training={stat:st,until:S.day+3}; S.stats.trained=(S.stats.trained||0)+1; n++; }
  UI.deskKey=''; if(n) addLog(`${n} temsilci en zayıf yönünde eğitime başladı (${fm(cost)}).`);
  toast(n?`${n} kişi eğitime gönderildi (${fm(cost)})`:'Eğitime uygun kimse ya da bütçe yok');
}

function sparkSVG(vals,color,zero){
  const W=300,H=96,P=6;
  if(vals.length<2) return `<text x="150" y="52" text-anchor="middle" font-size="12" fill="#626b8a" font-family="Manrope,sans-serif">Veri birikiyor…</text>`;
  let mn=Math.min(...vals), mx=Math.max(...vals); if(zero){mn=Math.min(mn,0);mx=Math.max(mx,0);} if(mx-mn<1e-9){mx+=1;mn-=1;}
  const x=i=>P+i*(W-2*P)/(vals.length-1), y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const base=zero?y(0):H-P; const id='g'+Math.random().toString(36).slice(2,7);
  let s=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=1;i<4;i++) s+=`<line x1="0" x2="${W}" y1="${(H/4*i).toFixed(1)}" y2="${(H/4*i).toFixed(1)}" stroke="rgba(158,174,222,.07)"/>`;
  if(zero) s+=`<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="rgba(158,174,222,.25)" stroke-dasharray="3 4"/>`;
  s+=`<polygon points="${x(0)},${base} ${pts} ${x(vals.length-1)},${base}" fill="url(#${id})"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  const lv=vals[vals.length-1];
  s+=`<circle cx="${x(vals.length-1)}" cy="${y(lv)}" r="4" fill="${color}" stroke="#070a14" stroke-width="2"/>`;
  return s;
}

/* ---------- ETKİLEŞİM ---------- */
function doConfirm(key){
  const [k,id]=key.split(':');
  if(k==='cancel'){ const c=S.contracts.find(x=>x.id==id); if(!c) return; const pen=Math.round(c.pay*c.cpd*5); S.money-=pen; const dr=Math.round(5*TIERS[c.tier].mult); S.rep=Math.max(0,S.rep-dr); S.contracts.splice(S.contracts.indexOf(c),1); addLog(`${c.co} sözleşmesi feshedildi: ${fm(pen)} tazminat, itibar −${dr}.`,'bad'); }
  else if(k==='fire'){ const a=S.agents.find(x=>x.id==id); if(!a) return; S.money-=a.sal; S.agents.splice(S.agents.indexOf(a),1); S.agents.forEach(x=>x.bonus-=2); addLog(`${a.name} ile yollar ayrıldı (tazminat ${fm(a.sal)}).`); }
  else if(k==='ipo'){ doIPO(); UI.view='dash'; UI.rendered=null; }
  else if(k==='reset'){ const i=UI.slot; S=null; UI.slot=null; deleteSlot(i); showMenu(); return; }
  UI.dirty=true;
}
function go(v){ UI.view=v; UI.pg=0; UI.rendered=null; UI.dirty=true; window.scrollTo({top:0}); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(menuClick(act,b)) return;
  if(act==='closeModal'){ nextModal(); return; }
  if(act==='rclose'){ b.closest('.rcard').remove(); return; }
  if(!S) return;
  const id=b.dataset.id;
  switch(act){
    case 'speed': S.speed=+b.dataset.v; break;
    case 'menu': exitToMenu(); return;
    case 'claim': { const g=S.goals.find(x=>x.id==id); claimGoal(g); break; }
    case 'qa': { const k=b.dataset.k; if(k==='sign')qaSign(); else if(k==='fill')qaFill(); else if(k==='rest')qaRest(); else if(k==='train')qaTrain(); break; }
    case 'go': go(b.dataset.v); break;
    case 'confirm': { const key=b.dataset.key; if(UI.confirm===key && performance.now()-UI.confirmT<4000){ UI.confirm=null; doConfirm(key); } else { UI.confirm=key; UI.confirmT=performance.now(); setTimeout(()=>{ if(UI.confirm===key){UI.confirm=null;UI.dirty=true;} },4100); } break; }
    case 'accept': { const o=S.offers.find(x=>x.id==id); if(o){ acceptOffer(o); toast(`${o.co} ile sözleşme imzalandı`); } break; }
    case 'event': { const it=S.inbox.find(x=>x.key==b.dataset.k); if(it) resolveEvent(it,+b.dataset.c,false); break; }
    case 'hire': { const c=S.candidates.find(x=>x.id==id); if(c) hire(c); break; }
    case 'recruit': { const cost=1500*(tierIdx()+1); S.money-=cost; S.candidates=[]; for(let i=0;i<4+Math.min(4,S.office);i++) S.candidates.push(genAgent(tierIdx())); S.candDay=S.day+7; addLog('İş ilanı yayınlandı, yeni adaylar geldi.'); break; }
    case 'train': { const a=S.agents.find(x=>x.id==id); if(a&&!a.training){ const c=trainCost(a); S.money-=c; a.training={stat:b.dataset.s,until:S.day+3}; S.stats.trained=(S.stats.trained||0)+1; UI.deskKey=''; addLog(`${a.name} 3 günlük eğitime başladı (${fm(c)}).`); } break; }
    case 'raise': { const a=S.agents.find(x=>x.id==id); if(a){ a.sal=Math.round(a.sal*1.1/50)*50; a.bonus+=18; addLog(`${a.name} zam aldı. Yeni maaş ${fm(a.sal)}.`); } break; }
    case 'sup': { const k=b.dataset.k; S.support[k]=Math.max(0,S.support[k]+ +b.dataset.v); break; }
    case 'pg': UI.pg+= +b.dataset.v; break;
    case 'tsel': UI.techSel=id; break;
    case 'branch': buyBranch(id); break;
    case 'tempo': S.tempo=+b.dataset.v; toast(`Çalışma temposu: ${TEMPO[S.tempo].n}`); break;
    case 'ad': startAd(); break;
    case 'vip': answerVip(); break;
    case 'achf': UI.achF=b.dataset.v; break;
    case 'tech': { const t=TECHS.find(x=>x.id===id); if(t&&!has(t.id)&&S.rp>=t.rp&&S.money>=t.m&&t.req.every(has)){ S.rp-=t.rp; S.money-=t.m; S.techs[t.id]=Math.floor(S.day)+1; addLog(`${t.n} devreye alındı.`,'good'); toast(`${t.n} kuruldu`); checkAch(); } break; }
    case 'office': { const nx=OFFICES[S.office+1]; if(nx&&S.money>=nx.cost){ S.money-=nx.cost; S.office++; addLog(`${nx.n}'na taşındın. ${nx.seats} masa hazır.`,'good'); toast(`Yeni tesis: ${nx.n}`); checkAch(); } break; }
    case 'loan': { const max=50000+S.rep*500; const amt=Math.round(max*.25); if(S.loan+amt<=max+1){ S.loan+=amt; S.money+=amt; addLog(`${fm(amt)} kredi çekildi.`); } break; }
    case 'repay': { const p=Math.min(S.loan,Math.max(0,S.money)); S.loan-=p; S.money-=p; addLog(`${fm(p)} kredi geri ödendi.`); break; }
    case 'perk': { const p=PERKS.find(x=>x.id===id); const lv=perk(id); if(p&&S.legacy.points>=p.cost&&lv<p.max){ S.legacy.points-=p.cost; S.legacy.spent[id]=lv+1; addLog(`Miras avantajı: ${p.n} (${lv+1}).`,'good'); } break; }
    case 'rename': { const v=($('#inName').value||'').trim(); if(v){ S.name=v.slice(0,40); toast('Şirket adı güncellendi'); } break; }
    case 'save': save(); toast('Kaydedildi'); break;
    case 'export': $('#saveCode').value=exportCode(); break;
    case 'copy': { const ta=$('#saveCode'); const v=ta.value; if(!v){ toast('Önce kayıt kodunu göster'); break; } const fb=()=>{ ta.focus(); ta.select(); toast('Metin seçildi, kopyalayabilirsin'); }; try{ navigator.clipboard.writeText(v).then(()=>toast('Kopyalandı'),fb); }catch(err){ fb(); } break; }
    case 'import': { try{ S=importCode($('#saveCode').value); UI.deskKey=''; UI.rendered=null; UI.lastTier=tierIdx(); save(); toast('Kayıt yüklendi'); }catch(err){ toast('Kod okunamadı. Kodun tamamını yapıştırdığından emin ol.'); } break; }
    case 'tog': return;
  }
  UI.dirty=true; renderTop();
});
document.addEventListener('change',e=>{ const t=e.target; if(!S||t.dataset.act!=='tog') return; const k=t.dataset.k; if(k==='rev') S.reviewModal=t.checked; else S.auto[k]=t.checked; });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='startName'){ const b=document.querySelector('[data-act="startGame"]'); if(b) b.click(); }
  if(e.key===' ' && S && !UI.modalOpen && !/INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName)){ e.preventDefault(); S.speed=S.speed?0:1; renderTop(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });

/* =========================== DÖNGÜ =========================== */
let lastT=performance.now();
function loop(){
  const now=performance.now(); const dtR=Math.min(1,(now-lastT)/1000); lastT=now;
  if(!S) return;
  if(S.speed>0 && !UI.modalOpen){ let dd=dtR/DAY_SEC*S.speed; while(dd>0){ const s=Math.min(.25,dd); step(s); dd-=s; } }
  if(!S) return;
  renderTop();
  if(UI.dirty || now-UI.lastSide>1500 || UI.rendered===null){ renderNav(); }
  if(UI.view==='dash'){
    if(UI.rendered!=='dash') renderView();
    renderBoard(); renderFloor(now);
    if(UI.logDirty) renderLog();
    if(UI.histLen!==S.hist.length){ UI.histLen=S.hist.length; renderCharts(); }
    if(UI.dirty || now-UI.lastSide>1500) updateDashSide();
  } else {
    if(UI.rendered!==UI.view || (UI.dirty && UI.view!=='settings') || (LIVE.has(UI.view) && now-UI.lastSide>1500) || (UI.view==='settings'&&UI.dirty&&!document.activeElement.matches('input,textarea'))) renderView();
    if(UI.logDirty && UI.view==='events'){ renderLog(); }
  }
  if(UI.dirty || now-UI.lastSide>1500) UI.lastSide=now;
  UI.dirty=false;
  if(now-UI.lastSave>10000){ UI.lastSave=now; save(); }
}
function start(data){
  loadMeta();
  if(data && data.S){ S=migrate(data.S); UI.slot=data.slot??0; UI.lastTier=tierIdx(); hideMenu(); }
  else showMenu();
  setInterval(loop,200);
}

function loop(){
  const now=performance.now(); const dtR=Math.min(1,(now-lastT)/1000); lastT=now;
  if(!S) return;
  if(S.speed>0 && !UI.modalOpen){ let dd=dtR/DAY_SEC*S.speed; while(dd>0){ const s=Math.min(.25,dd); step(s); dd-=s; } }
  if(!S) return;
  UI.view=TABMAP[UI.view]||UI.view;
  renderTop();
  const tick = UI.dirty || now-UI.lastSide>1500 || UI.rendered===null;
  if(tick) renderNav();
  if(UI.view==='hub'){
    if(UI.rendered!=='hub') renderView();
    renderBoard(); renderFloor(now);
    if(UI.logDirty) renderLog();
    if(tick) updateHub();
  } else if(UI.view==='corp'){
    const typing=document.activeElement&&document.activeElement.matches('input[type=text],textarea');
    if(UI.rendered!=='corp' || (UI.dirty&&!typing) || (now-(UI.lastCorp||0)>4000&&!typing)){ renderView(); UI.lastCorp=now; }
    if(UI.histLen!==S.hist.length){ UI.histLen=S.hist.length; renderCharts(); }
  } else {
    const sel=document.activeElement&&document.activeElement.tagName==='SELECT';
    if(UI.rendered!==UI.view || (tick&&!sel)) renderView();
  }
  vipTick(now); tutTick();
  if(tick) UI.lastSide=now;
  UI.dirty=false;
  if(now-UI.lastSave>10000){ UI.lastSave=now; save(); }
}

function addLoyal(c){ S.loyal=S.loyal||{}; const L=S.loyal[c.co]||{n:0,sector:c.sector}; const was=L.n; L.n=Math.min(3,L.n+1); S.loyal[c.co]=L;
  if(L.n>was) addLog(`${c.co} sadık müşterin oldu (seviye ${L.n}). Gelecek teklifleri daha kârlı olacak.`,'good'); }
function adActive(){ return (S.adUntil||0)>S.day; }
function adCost(){ return niceRound(4000*Math.pow(tierIdx()+1,2.2)); }
function startAd(){ const c=adCost(); if(S.money<c||adActive()) return; S.money-=c; S.adUntil=S.day+10; const ti=tierIdx();
  for(let i=0;i<2;i++) S.offers.push(genOffer(ti)); S.offerDay=Math.min(S.offerDay,S.day+1);
  addLog(`Reklam kampanyası başladı (${fm(c)}). 10 gün boyunca daha çok ve daha iyi teklif gelecek.`,'good'); toast('Reklam kampanyası başladı'); UI.dirty=true; }
function genOffer(ti,easy){
  let o=genOfferBase(ti,easy);
  if(!easy && adActive()){
    const nt=ti+1; if(nt<=4 && !(nt===4&&!has('global')) && Math.random()<.22){ o=genOfferBase(nt); o.stretch=true; }
    o.pay=Math.round(o.pay*1.1*2)/2;
  }
  const keys=Object.keys(S.loyal||{}).filter(k=>!S.contracts.some(c=>c.co===k)&&!S.offers.some(x=>x.co===k));
  if(!easy && keys.length && Math.random()<.28){ const k=pick(keys), L=S.loyal[k];
    o.co=k; o.sector=L.sector; o.loyal=L.n; o.kind='standart'; o.stretch=false; o.pay=Math.round(o.pay*(1+.08*L.n)*2)/2; o.slT-=3; o.fcrT-=3; o.csT-=3; o.exp+=4; }
  return o;
}

      <div class="row sp">${st.wait?`<span class="tuthint">👉 ${st.hint}</span>`:'<span></span>'}${st.wait?'':`<button class="btn pri sm" data-act="tutNext">${st.last?'Oynamaya başla':S.tut===0?'Başlayalım':'Devam'}</button>`}</div>`;
    setTimeout(()=>{ const e=st.el&&st.el(); if(!e) return; const hd=document.querySelector('.head'); const off=(hd&&getComputedStyle(hd).position==='sticky'?hd.offsetHeight:0)+16; const r=e.getBoundingClientRect(); if(r.top<off || r.top>innerHeight*0.4) window.scrollTo({top:Math.max(0,scrollY+r.top-off),behavior:'auto'}); tutTick(); },60);
